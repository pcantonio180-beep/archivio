<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archivio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f5bb7'/%3E%3Crect x='13' y='16' width='38' height='10' rx='3' fill='%23f2c26b'/%3E%3Cpath d='M16 26h32v19a4 4 0 0 1-4 4H20a4 4 0 0 1-4-4z' fill='%23fff8ea'/%3E%3C/svg%3E">
<style>
:root { color-scheme: light dark; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
  background: #f3efe6; color: #1d2230; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; }
@media (prefers-color-scheme: dark) { body { background: #121419; color: #ebe7de; } .carta { background: #1b1e25 !important; } }
.carta { background: #fffdf8; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,.12); padding: 32px 28px; max-width: 420px; }
svg.logo { width: 60px; height: 60px; }
h1 { font-size: 22px; margin: 14px 0 6px; }
p { color: #6a6f7c; margin: 6px 0; }
@media (prefers-color-scheme: dark) { p { color: #9aa0ab; } }
.ruota { width: 22px; height: 22px; border-radius: 50%; border: 3px solid #2f5bb7; border-right-color: transparent;
  animation: gira .8s linear infinite; display: inline-block; margin-top: 10px; }
@keyframes gira { to { transform: rotate(360deg); } }
a.bottone { display: inline-block; margin-top: 14px; background: #2f5bb7; color: #fff; text-decoration: none;
  font-weight: 600; padding: 12px 22px; border-radius: 12px; }
.spento { display: none; }
</style>
</head>
<body>
<div class="carta">
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#2f5bb7"/><rect x="13" y="16" width="38" height="10" rx="3" fill="#f2c26b"/><path d="M16 26h32v19a4 4 0 0 1-4 4H20a4 4 0 0 1-4-4z" fill="#fff8ea"/><rect x="26" y="31" width="12" height="4" rx="2" fill="#c98a2b"/></svg>
  <h1>Archivio</h1>
  <div id="vai"><p>Ti porto all'archivio…</p><span class="ruota"></span></div>
  <div id="spento" class="spento">
    <p><b>L'archivio in questo momento non è raggiungibile.</b></p>
    <p>Il computer di casa potrebbe essere spento o senza internet. Riprova tra qualche minuto.</p>
    <a class="bottone" href="" onclick="location.reload();return false">Riprova</a>
  </div>
</div>
<script>
(async () => {
  const imposta = new URLSearchParams(location.hash.slice(1)).get("imposta");
  let url = null;
  try {
    const r = await fetch("indirizzo.json?t=" + Date.now(), { cache: "no-store" });
    if (r.ok) { const d = await r.json(); url = (d.url || "").replace(/\/+$/, ""); }
  } catch {}
  if (url && /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(url)) {
    location.replace(imposta ? url + "/imposta#t=" + encodeURIComponent(imposta) : url + "/");
  } else {
    document.getElementById("vai").style.display = "none";
    document.getElementById("spento").style.display = "block";
  }
})();
</script>
</body>
</html>
